<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" data-keep="">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" data-keep="">
<title data-keep="">Innocent Omale | Graphic Designer</title>
<meta name="description" content="Innocent Omale is a graphic designer working with clients worldwide. Brand identity, print design and corporate layouts for businesses and organizations. Request a quote on WhatsApp." data-keep="">
<meta property="og:title" content="Innocent Omale | Graphic Designer" data-keep="">
<meta property="og:description" content="Brand identity, print and corporate layouts for businesses and organizations, wherever you are." data-keep="">
<meta property="og:type" content="website" data-keep="">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D93A28'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='30' fill='%23fff'%3EIO%3C/text%3E%3C/svg%3E" data-keep="">
<link rel="preconnect" href="https://fonts.googleapis.com" data-keep="">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" data-keep="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" data-keep="">
<style data-keep="">
:root{--bg:#0E0E0D;--surface:#171715;--surface2:#201F1C;--text:#F6F2EA;--muted:#A19C91;--line:#2C2B27;--accent:#D93A28;--accent2:#FF6A3D;--link:#FF7A52;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0E0E0D;--surface:#171715;--surface2:#201F1C;--text:#F6F2EA;--muted:#A19C91;--line:#2C2B27;--link:#FF7A52;color-scheme:dark}
:root[data-theme="light"]{--bg:#F6F2EA;--surface:#EDE7DA;--surface2:#E3DCCB;--text:#121210;--muted:#5F5B53;--line:#D6CFBD;--link:#B82A1A;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(84px + env(safe-area-inset-top,0px));-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Space Grotesk",Inter,system-ui,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.05;font-weight:700}
p{margin:0}
a{color:var(--link)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--link);outline-offset:3px}
.wrap{width:min(1200px,100% - 40px);margin-inline:auto}
.sp{flex:1}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.hdr .in{display:flex;align-items:center;gap:12px;height:68px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);font-family:"Space Grotesk",Inter,sans-serif;font-weight:700}
.logo .mark{font-size:28px;color:var(--link);letter-spacing:-.04em}
.logo .nm{font-size:15px;font-weight:500;color:var(--muted)}
.logo img{height:30px;width:auto;display:block}
.nav-d{display:none;gap:26px;margin-left:28px}
.nav-d a{color:var(--text);text-decoration:none;font-size:15px;opacity:.82}
.nav-d a:hover{opacity:1}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer}
.nav-m{position:relative}
.nav-m summary{list-style:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;cursor:pointer}
.nav-m summary::-webkit-details-marker{display:none}
.nav-m .drop{position:absolute;right:0;top:54px;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;display:grid}
.nav-m .drop a{padding:12px 14px;text-decoration:none;color:var(--text);border-radius:12px}
.nav-m .drop a:hover{background:var(--surface2)}
@media(min-width:900px){.nav-d{display:flex}.nav-m{display:none}}
@media(max-width:520px){.logo .nm{display:none}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:14px;padding:6px 6px 6px 22px;min-height:48px;border-radius:999px;border:1px solid transparent;font:600 15px/1 Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex:none}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary .ico{background:#fff;color:var(--accent)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--muted)}
.btn-ghost .ico{background:var(--text);color:var(--bg)}
.btn.sm{min-height:44px;padding:4px 4px 4px 16px;font-size:14px;gap:10px}
.btn.sm .ico{width:34px;height:34px}
@media(max-width:380px){.btn.sm{padding-left:12px;font-size:13px}}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:32px;margin-top:8px;min-height:min(88svh,800px);padding:clamp(24px,4vw,56px);color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:36px;background:radial-gradient(110% 120% at 85% 0%,#F26A3A 0%,#D93A28 30%,#8A2014 66%,#2B0B07 100%)}
.slot{border:1.5px dashed currentColor;background:rgba(0,0,0,.25);color:#fff;border-radius:999px;min-height:44px;padding:0 18px;font:600 14px Inter,sans-serif;cursor:pointer}
.slot-hero{position:absolute;right:20px;bottom:20px;z-index:3;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.slot-logo{color:var(--link);background:transparent;min-height:36px;padding:0 12px;font-size:13px}
@media(max-width:700px){.slot-logo{display:none}}
.hero-art{position:absolute;right:-3%;top:-4%;font:700 clamp(230px,40vw,580px)/.8 "Space Grotesk",Inter,sans-serif;letter-spacing:-.07em;color:#0E0E0D;opacity:.9;pointer-events:none;user-select:none}
.hero-photo{position:absolute;right:clamp(20px,5%,64px);top:50%;transform:translateY(-50%);width:clamp(180px,22vw,300px);height:auto;aspect-ratio:4/5;border-radius:28px;object-fit:cover;object-position:center 20%;border:4px solid rgba(255,255,255,.9);box-shadow:0 24px 70px rgba(0,0,0,.4);pointer-events:none}
@media(max-width:720px){.hero-photo{position:relative;right:auto;top:auto;transform:none;order:-1;align-self:center;width:min(62vw,240px);border-radius:24px;border-width:3px}}
.hero>*:not(.hero-art):not(.hero-photo):not(.hero-logo):not(.slot){position:relative;z-index:1}
.hero .hi{font-size:clamp(18px,2vw,24px);font-weight:500;margin-bottom:16px}
.hero h1{font-size:clamp(60px,12vw,176px);line-height:.9;letter-spacing:-.045em}
.ln{display:block;overflow:hidden;padding-bottom:.18em;margin-bottom:-.1em}
.ln>span{display:block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.ln:nth-child(2)>span{animation-delay:.12s}
.ln.static>span{animation:none;transform:none}
@keyframes up{to{transform:none}}
.hero-mid{display:grid;gap:26px;max-width:560px}
.hero-mid .lead{font-size:clamp(20px,2.4vw,28px);line-height:1.25;font-weight:600;font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
.hero-mid .sub{opacity:.88;max-width:46ch}
.hero .btns{display:flex;flex-wrap:wrap;gap:12px}
.hero .btn-primary{background:#fff;color:#111}
.hero .btn-primary .ico{background:var(--accent);color:#fff}
.hero .btn-ghost{color:#fff;border-color:rgba(255,255,255,.6)}
.hero .btn-ghost .ico{background:#fff;color:#111}
.svc-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;border-top:1px solid rgba(255,255,255,.28);padding-top:20px;font-size:14.5px}
.svc-row b{display:block;font-weight:500;opacity:.8;font-size:13px;margin-bottom:2px}
@media(max-width:720px){.svc-row{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){.ln>span{animation:none;transform:none}html{scroll-behavior:auto}.btn,.card .thumb img{transition:none}}

/* collab */
.collab{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:26px 4px;color:var(--muted);font-size:14.5px}
.collab .pill{padding:8px 16px;border-radius:999px;border:1px solid var(--line);color:var(--text);font-weight:500}

/* sections */
.sec{padding:clamp(64px,9vw,120px) 0}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:20px 40px;flex-wrap:wrap;margin-bottom:40px}
.sec-h h2{font-size:clamp(36px,6vw,68px)}
.sec-h p{color:var(--muted);max-width:40ch}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.fbtn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font:500 14.5px Inter,sans-serif;cursor:pointer}
.fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* work */
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.thumb{aspect-ratio:4/5;background:var(--surface2);overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.card:hover .thumb img{transform:scale(1.03)}
/* real projects: show each cover at its own shape (square, 4:5, story) with no cropping */
#work-grid{display:block;column-width:290px;column-gap:20px}
#work-grid .card{break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 20px;display:block}
#work-grid .thumb{aspect-ratio:auto;background:var(--surface2)}
#work-grid .thumb img{height:auto;object-fit:initial}
#work-grid .thumb:empty{aspect-ratio:4/5}
.thumb.ph{display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.9)}
.thumb.ph .io{font:700 90px/1 "Space Grotesk",Inter,sans-serif;letter-spacing:-.06em;opacity:.9}
.thumb.ph small{display:block;font-size:13px;opacity:.85}
.ph1{background:linear-gradient(150deg,#D93A28,#7A1A10)}
.ph2{background:linear-gradient(150deg,#2A2927,#0E0E0D)}
.ph3{background:linear-gradient(150deg,#F26A3A,#D93A28)}
.ph4{background:linear-gradient(150deg,#3b3a37,#1b1a18)}
.ph5{background:linear-gradient(150deg,#8A2014,#2B0B07)}
.ph6{background:linear-gradient(150deg,#B6341F,#F26A3A)}
.card-meta{padding:16px 18px 20px;display:grid;gap:8px}
.card h3{font-size:22px}
.card .sub{color:var(--muted);font-size:14.5px}
.card-hit{position:absolute;inset:0;width:100%;height:100%;background:none;border:0;cursor:pointer;border-radius:24px}
.chip{display:inline-block;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--text);width:fit-content}
.empty{color:var(--muted);padding:40px 0}

/* services */
.svc{display:grid;gap:12px 40px;grid-template-columns:1fr;align-items:center;padding:28px 0;border-top:1px solid var(--line)}
.svc:last-child{border-bottom:1px solid var(--line)}
.svc h3{font-size:clamp(24px,3vw,34px)}
.svc p{color:var(--muted);max-width:52ch}
.svc .btn{justify-self:start}
@media(min-width:900px){.svc{grid-template-columns:1.1fr 1.4fr auto}.svc .btn{justify-self:end}}

/* process */
.steps{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.step{border-top:2px solid var(--line);padding-top:20px}
.step .n{font:700 56px/1 "Space Grotesk",Inter,sans-serif;color:var(--link);letter-spacing:-.04em;margin-bottom:14px}
.step h3{font-size:24px;margin-bottom:8px}
.step p{color:var(--muted)}

/* about */
.about{display:grid;gap:36px;grid-template-columns:1fr;align-items:center}
@media(min-width:900px){.about{grid-template-columns:.85fr 1.15fr;gap:64px}}
.about-art{aspect-ratio:4/5;border-radius:32px;overflow:hidden;position:relative;background:radial-gradient(110% 120% at 85% 0%,#F26A3A 0%,#D93A28 30%,#8A2014 66%,#2B0B07 100%);display:grid;place-items:center}
.about-art .io{font:700 clamp(150px,22vw,300px)/.8 "Space Grotesk",Inter,sans-serif;letter-spacing:-.07em;color:#0E0E0D;opacity:.9}
.about-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.about h2{font-size:clamp(34px,5vw,60px);margin-bottom:22px}
.about p{color:var(--muted);margin-bottom:16px;max-width:58ch}
.about p.big{color:var(--text);font-size:19px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* testimonials */
.quotes{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
blockquote{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px}
blockquote p{font-size:18px;margin-bottom:18px}
blockquote footer{color:var(--muted);font-size:14.5px}

/* contact */
.contact{display:grid;gap:40px;grid-template-columns:1fr}
@media(min-width:900px){.contact{grid-template-columns:.9fr 1.1fr;gap:64px}}
.contact h2{font-size:clamp(36px,6vw,68px);margin-bottom:20px}
.contact .lead{color:var(--muted);max-width:42ch;margin-bottom:28px}
.reach{display:grid;gap:10px}
.reach a{color:var(--text);text-decoration:none;font-size:18px;font-weight:500}
.reach a span{display:block;color:var(--muted);font-size:13.5px;font-weight:400}
.form{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,3vw,36px);display:grid;gap:16px}
label{display:grid;gap:6px;font-size:14.5px;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 16px;min-height:48px;font:400 16px Inter,system-ui,sans-serif}
textarea{min-height:130px;resize:vertical}
.two{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.status{font-size:14.5px;color:var(--muted)}
.status a{font-weight:600}

/* footer */
.ftr{border-top:1px solid var(--line);margin-top:40px;padding:36px 0 56px;color:var(--muted);font-size:14.5px}
.ftr .in{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;justify-content:space-between}
.ftr .links{display:flex;flex-wrap:wrap;gap:8px 22px}
.ftr a{color:var(--text);text-decoration:none}

/* modal */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:flex-start}
.mdl{background:var(--bg);border:1px solid var(--line);border-radius:28px;width:min(920px,100%);padding:clamp(20px,4vw,40px)}
.mdl .top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.mdl h2{font-size:clamp(30px,5vw,52px);margin:12px 0}
.facts{display:grid;gap:14px 28px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:22px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts b{display:block;color:var(--muted);font-weight:500;font-size:13.5px}
.mdl .desc{max-width:62ch;color:var(--muted);margin-bottom:20px}
.shots{display:grid;gap:14px;margin:24px 0}
.shots img{width:100%;border-radius:20px;display:block;background:var(--surface2)}
.outcome{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;margin-bottom:24px}
.outcome b{display:block;margin-bottom:6px}

/* admin */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--text);color:var(--bg);font:600 15px Inter,sans-serif;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.fab i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent2);margin-left:8px}
.adm{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);z-index:90;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.adm-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.adm-h h2{font-size:22px}
.tabs{display:flex;gap:8px;padding:12px 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.adm-b{flex:1;overflow:auto;padding:20px}
.adm-f{border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.meter{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent2)}
.meter.warn i{background:#E5B13A}
.small{font-size:13.5px;color:var(--muted)}
.sbtn{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--text);font:600 14px Inter,sans-serif;cursor:pointer}
.sbtn.pri{background:var(--accent);border-color:transparent;color:#fff}
.sbtn.dng{color:#FF8A7A}
.sbtn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.item{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item .tn{width:64px;height:64px;border-radius:14px;background:var(--surface2);overflow:hidden}
.item .tn img{width:100%;height:100%;object-fit:cover;display:block}
.item .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.msg{padding:12px 14px;border-radius:14px;background:var(--surface2);margin-bottom:16px;font-size:14.5px}
.check{display:flex;align-items:center;gap:10px;color:var(--text)}
.check input{width:22px;height:22px;min-height:0}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:8px 0 14px}
.gal div{background:var(--surface2);border-radius:14px;padding:6px;display:grid;gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.gal .row{gap:4px}
.gal .sbtn{min-height:36px;padding:0 10px}
.adm hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.adm h3{font-size:18px;margin-bottom:10px}

/* logo used in place of the IO text */
.hero-logo{position:absolute;right:5%;top:8%;width:clamp(200px,34vw,480px);height:auto;max-height:70%;object-fit:contain;pointer-events:none}
.about-logo{width:62%;max-height:62%;object-fit:contain}
.thumb.ph .ph-logo{width:96px;height:auto;max-height:96px;object-fit:contain}
.ftr .flogo{height:28px;width:auto;vertical-align:middle}
/* private PDF page, opened with ?pdf */
#print-root{display:none}
body.pdfmode #root,body.pdfmode #modal-root,body.pdfmode #admin-root,body.pdfmode #bgvid{display:none!important}
body.pdfmode{background:#0E0E0D}
body.pdfmode #print-root{display:block;min-height:100vh}
.pdf-bar{position:sticky;top:0;z-index:5;display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 20px;background:#171715;color:#F6F2EA;font:500 15px Inter,system-ui,sans-serif;border-bottom:1px solid #2C2B27}
.pdf-bar span{display:block;color:#A19C91;font-weight:400;font-size:13px;margin-top:2px;max-width:70ch}
.pdf-stack{display:grid;gap:20px;justify-content:center;padding:20px}
.pdf-slot{position:relative;width:calc(1280px*var(--ps,1));height:calc(720px*var(--ps,1));overflow:hidden;border-radius:10px}
.pdf-page{position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(var(--ps,1));transform-origin:top left;background:#0E0E0D;color:#F6F2EA;font:400 17px/1.5 Inter,system-ui,sans-serif;padding:60px 72px 96px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pdf-page *{box-sizing:border-box}
.pdf-page h1,.pdf-page h2,.pdf-page h3{font-family:"Space Grotesk",Inter,system-ui,sans-serif;letter-spacing:-.025em;line-height:1.04;font-weight:700}
.pdf-page :where(h1,h2,h3,p,dl,dd){margin:0}
.pdf-label{color:#E8553F;font-weight:600;font-size:15px;margin-bottom:14px}
.pdf-foot{position:absolute;left:72px;right:72px;bottom:30px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #2C2B27;padding-top:14px;font-size:13px;color:#A19C91}
.pdf-foot span{display:flex;align-items:center;gap:12px}
.pdf-foot i{font-style:normal}

/* image handling */
function readFile(file){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=function(){rej(new Error('Could not read the file.'))};r.readAsDataURL(file)})}
function compress(file,max,q){
 return readFile(file).then(function(url){return new Promise(function(res,rej){
  var img=new Image();
  img.onload=function(){
   var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,max/Math.max(w,h));
   w=Math.max(1,Math.round(w*sc));h=Math.max(1,Math.round(h*sc));
   var c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   var out=c.toDataURL('image/webp',q);
   if(out.indexOf('data:image/webp')!==0)out=c.toDataURL('image/jpeg',q);
   res(out);
  };
  img.onerror=function(){rej(new Error('That file is not an image the browser can read.'))};
  img.src=url;
 })});
}
function addImage(file,max,q){
 if(!file||!/^image\//.test(file.type))return Promise.reject(new Error('Choose an image file (JPG, PNG or WebP).'));
 if(file.size>25*1048576)return Promise.reject(new Error('That image is over 25 MB. Export a smaller copy and try again.'));
 if(file.type==='image/svg+xml'){
  if(file.size>600*1024)return Promise.reject(new Error('That SVG is over 600 KB. Simplify it and try again.'));
  return readFile(file);
 }
 return compress(file,max,q);
}

 var tabs=[['projects','Projects'],['testimonials','Testimonials'],['settings','Settings']];

  '<div class="tabs">'+tabs.map(function(t){return '<button class="sbtn" data-action="tab" data-v="'+t[0]+'" aria-pressed="'+(ui.tab===t[0])+'"'+(ui.tab===t[0]?' style="background:var(--accent);color:#fff;border-color:transparent"':'')+'>'+t[1]+'</button>'}).join('')+'</div>'+
  '<div class="adm-b">'+(ui.msg?'<div class="msg" role="status">'+esc(ui.msg)+'</div>':'')+body+'</div>'+
  '<div class="adm-f">'+meterHtml()+'<div class="small">'+(ui.dirty?'You have changes that are not live yet.':'Everything here is live.')+'</div><button class="sbtn pri" data-action="publish"'+((!ui.dirty||ui.pub==='working')?' disabled':'')+'>'+pubLabel+'</button></div></div>';

 var data=JSON.stringify(STATE).replace(/</g,'\\u003c');

 return '<!doctype html>\n<html lang="en">\n<head>\n'+keep+'\n</head>\n<body>\n<div id="root"></div>\n<div id="modal-root"></div>\n<div id="admin-root"></div>\n<script id="site-data" type="application/json">'+data+'<\/script>\n<script id="app-script">'+script+'<\/script>\n</body>\n</html>';

function publishSite(){
 if(!ART||ui.pub==='working')return;
 if(sizeBytes()>15.5*1048576){setMsg('The site is too large to publish. Remove some images or upload smaller ones.');return}
 ui.pub='working';admin();
 ART.publish(buildHtml()).then(function(){ui.pub='done';ui.dirty=false;admin()}).catch(function(e){
  ui.pub='';
  var c=e&&e.code,m='Publishing failed. Please try again in a moment.';
  if(c==='too_large')m='The site is too large to publish. Remove some images or upload smaller ones.';
  else if(c==='not_writer'||c==='not_granted'||c==='consent_required')m='This account cannot publish changes to the site.';
  else if(c==='rate_limited')m='You are publishing too quickly. Wait a minute, then publish once with all your changes.';
  else if(c==='conflict')m='A newer version was published elsewhere. The page will reload with it.';
  setMsg(m);
 });
}

document.addEventListener('click',function(e){

 if(dm){var det=dm.closest('details');if(det)det.open=false}

 var a=t.dataset.action,id=t.dataset.id,i=Number(t.dataset.i);
 if(a==='close-bg'){if(e.target===t)closeProject();return}
 if(a==='pdf-print'){pdfPrint();return}
 if(a==='theme'){setTheme(document.documentElement.getAttribute('data-theme')==='light'?'dark':'light');render();return}
 if(a==='filter'){ui.filter=t.dataset.v;render();return}
 if(a==='open'){openProject(id,t);return}
 if(a==='close'){closeProject();return}
 if(a==='request'){goContact(t.dataset.v,'');return}
 if(a==='similar'){var p=STATE.projects.filter(function(x){return x.id===id})[0];goContact(p?p.category==='Brand Identity'?'Brand Identity':p.category==='Print'?'Print Design':p.category==='Corporate Layout'?'Corporate & Document Layouts':p.category==='Social Media'?'Social Media Design':'':'', p?'I would like something similar to "'+p.title+'".':'');return}
 /* admin */
 if(!ui.owner)return;
 if(a==='pick'){pickFile(t.dataset.v);return}
 if(a==='quick-new'){ui.adm=true;ui.tab='projects';ui.draft=newDraft();ui.editingId=null;ui.msg='';admin();return}
 if(a==='adm-open'){ui.adm=true;ui.msg='';admin();return}
 if(a==='adm-close'){syncDraft();ui.adm=false;ui.confirm=null;admin();return}
 if(a==='tab'){syncDraft();ui.tab=t.dataset.v;ui.msg='';ui.confirm=null;admin();return}
 if(a==='new'){ui.draft=newDraft();ui.editingId=null;ui.msg='';admin();return}
 if(a==='edit'){var p2=STATE.projects.filter(function(x){return x.id===id})[0];if(p2){ui.draft=JSON.parse(JSON.stringify(p2));ui.editingId=id;ui.msg='';admin()}return}
 if(a==='cancel-project'){ui.draft=null;ui.editingId=null;ui.msg='';admin();return}
 if(a==='toggle'){var p3=STATE.projects.filter(function(x){return x.id===id})[0];if(p3){p3.published=!p3.published;ui.dirty=true;render();admin()}return}
 if(a==='del'){if(ui.confirm==='del:'+id){STATE.projects=STATE.projects.filter(function(x){return x.id!==id});ui.confirm=null;ui.dirty=true;ui.msg='Project deleted. Publish to make it live.';render();admin()}else{ui.confirm='del:'+id;admin()}return}
 if(a==='cover-rm'){syncDraft();ui.draft.cover='';admin();return}
 if(a==='gal-rm'){syncDraft();ui.draft.gallery.splice(i,1);admin();return}
 if(a==='gal-up'&&i>0){syncDraft();var g=ui.draft.gallery;var x=g[i];g[i]=g[i-1];g[i-1]=x;admin();return}
 if(a==='gal-dn'){syncDraft();var g2=ui.draft.gallery;if(i<g2.length-1){var y=g2[i];g2[i]=g2[i+1];g2[i+1]=y}admin();return}
 if(a==='save-project'){
  syncDraft();var d=ui.draft;
  if(!d.title.trim()){setMsg('Add a title before saving.');return}
  if(d.published&&!d.cover&&!d.gallery.length){setMsg('Add a cover image, or untick Published to save this as a draft.');return}
  d.title=d.title.trim();
  if(ui.editingId){STATE.projects=STATE.projects.map(function(p){return p.id===ui.editingId?d:p})}
  else{d.id='p'+Date.now().toString(36);d.created=Date.now();STATE.projects.push(d)}
  ui.draft=null;ui.editingId=null;ui.dirty=true;ui.msg='Project saved. Publish to make it live.';render();admin();return;
 }
 if(a==='add-test'){
  var n=$('#t-name').value.trim(),q=$('#t-quote').value.trim();
  if(!n||!q){setMsg('Add a name and what they said.');return}
  STATE.testimonials.push({name:n,role:$('#t-role').value.trim(),quote:q});ui.dirty=true;ui.msg='Testimonial added. Publish to make it live.';render();admin();return;
 }
 if(a==='del-test'){if(ui.confirm==='tdel:'+i){STATE.testimonials.splice(i,1);ui.confirm=null;ui.dirty=true;render();admin()}else{ui.confirm='tdel:'+i;admin()}return}
 if(a==='save-settings'){
  var s=STATE.settings,wa=$('#s-wa').value.replace(/\D/g,'');
  if(wa.length<8){setMsg('Enter your WhatsApp number with the country code, for example 2348124866017.');return}
  s.whatsapp=wa;s.email=$('#s-email').value.trim();s.x=$('#s-x').value.trim();s.tiktok=$('#s-tiktok').value.trim();s.instagram=$('#s-instagram').value.trim();
  ui.dirty=true;ui.msg='Settings saved. Publish to make them live.';render();admin();return;
 }
 if(a==='rm-portrait'){STATE.settings.portrait='';ui.dirty=true;render();admin();return}
 if(a==='rm-logo'){STATE.settings.logo='';ui.dirty=true;render();admin();return}
 if(a==='publish'){publishSite();return}
});
function pickFile(kind){var inp=document.createElement('input');inp.type='file';inp.accept=kind==='logo'?'image/svg+xml,image/png,image/webp':'image/*';inp.onchange=function(){handleFiles(kind,Array.prototype.slice.call(inp.files||[]))};inp.click()}
document.addEventListener('change',function(e){
 var t=e.target;if(!t.dataset||!t.dataset.file||!ui.owner)return;
 handleFiles(t.dataset.file,Array.prototype.slice.call(t.files||[]));
});
function handleFiles(kind,files){
 if(!files.length)return;
 syncDraft();
 var chain=Promise.resolve(),added=0;
 files.forEach(function(f){chain=chain.then(function(){
  var max=kind==='portrait'?1400:kind==='logo'?600:1600,q=kind==='portrait'?.86:.82;
  return addImage(f,max,q).then(function(url){
   if(kind==='cover')ui.draft.cover=url;
   else if(kind==='gallery')ui.draft.gallery.push(url);
   else if(kind==='portrait')STATE.settings.portrait=url;
   else if(kind==='logo')STATE.settings.logo=url;
   added++;
  });
 })});
 chain.then(function(){
  if(kind==='portrait'||kind==='logo'){ui.dirty=true;ui.adm=true;ui.tab='settings';render()}
  ui.msg=added+(added===1?' image added.':' images added.')+(kind==='portrait'||kind==='logo'?' Publish to make it live.':' Save the project to keep it.');
  admin();
 }).catch(function(err){ui.msg=err&&err.message?err.message:'That image could not be added.';admin()});
}

 var msg='Hello Innocent, my name is '+n+'.\nService: '+$('#f-service').value+'\nBudget: '+$('#f-budget').value+'\nDetails: '+d+'\nYou can reach me on: '+c;
 var url=waLink(msg);

 st.innerHTML='Opening WhatsApp. If nothing opened, <a href="'+esc(url)+'" target="_blank" rel="noopener">tap here to send your message</a>.';

 });

function applyBg(){
 var v=$('#bgvid'),u=STATE.settings.bgvideo;
 var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 var save=navigator.connection&&navigator.connection.saveData;
 if(!u||!/^\/[^"'<>\s]+\.(mp4|webm)$/i.test(u)||reduce||save){if(v)v.remove();document.body.classList.remove('has-bg');return}
 if(!v){v=document.createElement('video');v.id='bgvid';v.muted=true;v.defaultMuted=true;v.loop=true;v.autoplay=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('aria-hidden','true');v.preload='auto';document.body.insertBefore(v,document.body.firstChild)}
 if(v.getAttribute('src')!==u)v.src=u;
 document.body.classList.add('has-bg');
 var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});

  STATE.settings.portrait=normImg(STATE.settings.portrait);STATE.settings.logo=normImg(STATE.settings.logo);

  render();applyBg();applyFavicon();if(PDFMODE)buildPdfView();
 });
}
